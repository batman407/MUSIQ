services:
  omr-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    environment:
      - PORT=${PORT:-3001}
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN:-https://musiq-sooty.vercel.app}
      - JAVA_TOOL_OPTIONS=-Djava.awt.headless=true
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-3}
      - JOB_CLEANUP_MINUTES=${JOB_CLEANUP_MINUTES:-60}
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - omr-data:/app/jobs
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

volumes:
  omr-data:
